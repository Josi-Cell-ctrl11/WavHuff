name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK, NDK and CMake
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify real MP3 encoding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 tools/test_native.py
      - name: Test and build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WavHuff-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WavHuff-APK
          path: WavHuff-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
